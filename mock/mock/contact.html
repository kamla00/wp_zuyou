<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="逗葉地域医療センターへのお問合せフォームです。検診事業、急患診療、訪問看護、在宅医療に関するご質問・ご相談を承っております。">
  <title>お問合せ | 公益財団法人逗葉地域医療センター</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* お問合せフォーム 独自スタイル */
    .contact-form {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .contact-form__row {
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
    }

    .contact-form__label {
      width: 100%;
      max-width: 240px;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--mh--color--primary-800);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }

    @media (min-width: 768px) {
      .contact-form__label {
        margin-bottom: 0;
        padding-top: 12px;
      }
    }

    .contact-form__required {
      background: #e63946;
      color: #fff;
      font-size: 1.1rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 10px;
      font-weight: 400;
    }

    .contact-form__optional {
      background: #999;
      color: #fff;
      font-size: 1.1rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 10px;
      font-weight: 400;
    }

    .contact-form__input-wrap {
      flex: 1;
      min-width: 300px;
    }

    .contact-form__radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px 25px;
      padding-top: 10px;
    }

    .contact-form__radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .contact-form__radio-label input[type="radio"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .contact-form__input[type="text"],
    .contact-form__input[type="email"],
    .contact-form__input[type="tel"],
    .contact-form__textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1.6rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    .contact-form__textarea {
      height: 200px;
      resize: vertical;
    }

    .contact-form__input:focus,
    .contact-form__textarea:focus {
      outline: none;
      border-color: var(--mh--color--primary-400);
      box-shadow: 0 0 0 3px rgba(0, 145, 201, 0.1);
    }

    .contact-form__submit {
      text-align: center;
      margin-top: 50px;
    }

    .contact-form__btn {
      display: inline-block;
      background: var(--mh--color--primary-500);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 18px 80px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(60,105,156,0.2);
    }

    .contact-form__btn:hover {
      background: var(--mh--color--primary-600);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(60,105,156,0.25);
    }

    /* 吹き出しのスタイル */
    .contact-intro {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .contact-balloon {
      position: relative;
      background: #fff; /* 背景を白に変更 */
      border: 2px solid var(--mh--color--primary-200);
      border-radius: 15px;
      padding: 20px 25px;
      max-width: 450px;
      box-shadow: 0 4px 12px rgba(60,105,156,0.08);
    }

    .contact-balloon::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -10px;
      margin-top: -10px;
      border-style: solid;
      border-width: 10px 0 10px 10px;
      border-color: transparent transparent transparent #fff; /* 白に変更 */
      z-index: 2;
    }

    .contact-balloon::before {
      content: "";
      position: absolute;
      top: 50%;
      right: -12px;
      margin-top: -11px;
      border-style: solid;
      border-width: 11px 0 11px 11px;
      border-color: transparent transparent transparent #c6e0ec; /* 直接枠線色指定 */
      z-index: 1;
    }

    .contact-balloon__text {
      font-size: 1.5rem;
      line-height: 1.6;
      color: var(--mh--color--primary-800);
      font-weight: 500;
      margin: 0;
    }

    .contact-intro__img {
      max-width: 240px;
      width: 100%;
      height: auto;
    }

    @media (max-width: 767px) {
      .contact-intro {
        flex-direction: column-reverse;
      }
      .contact-balloon::after {
        top: -10px;
        right: 50%;
        margin-right: -10px;
        margin-top: 0;
        border-width: 0 10px 12px 10px;
        border-color: transparent transparent var(--mh--color--primary-50) transparent;
      }
      .contact-balloon::before {
        top: -13px;
        right: 50%;
        margin-right: -11px;
        margin-top: 0;
        border-width: 0 11px 13px 11px;
        border-color: transparent transparent var(--mh--color--primary-200) transparent;
      }
    }
  </style>
</head>
<body class="page-contact">

  <!-- ========================================
       Header
       ======================================== -->
  <div id="site-header"></div>

  <!-- ========================================
       Page Hero
       ======================================== -->
  <section class="page-hero page-hero--particle">
    <canvas class="page-hero__canvas" id="js-hero-canvas"></canvas>
    <div class="page-hero__inner">
      <div class="container">
        <p class="page-hero__label">Contact</p>
        <div class="page-hero__container">
          <h1 class="page-hero__title">お問合せ</h1>
          <p class="page-hero__sub">逗葉地域医療センターの各事業に関するご質問・ご相談を承っております。<br>以下のフォームより必要事項をご入力の上、送信してください。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ========================================
       Contact Form Section
       ======================================== -->
  <section class="section" style="background-color: #fff; padding-top: 40px;">
    <div class="l-container">
      <div class="contact-intro">
        <div class="contact-balloon">
          <p class="contact-balloon__text">担当者からの返信に若干お時間をいただく場合があります。お急ぎの場合は電話にてご確認ください。</p>
        </div>
        <img src="images/fm4-no-bg.png" alt="" class="contact-intro__img">
      </div>
      <div class="contact-form">
        <form id="js-contact-form" action="#" method="post">
          
          <!-- お問合せ部署 -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              お問合せ部署<span class="contact-form__required">必須</span>
            </div>
            <div class="contact-form__input-wrap">
              <div class="contact-form__radio-group">
                <label class="contact-form__radio-label">
                  <input type="radio" name="department" value="検診事業" data-email="kenshin@example.com" required> 検診事業
                </label>
                <label class="contact-form__radio-label">
                  <input type="radio" name="department" value="急患診療" data-email="kyukan@example.com"> 急患診療
                </label>
                <label class="contact-form__radio-label">
                  <input type="radio" name="department" value="訪問看護" data-email="kango@example.com"> 訪問看護
                </label>
                <label class="contact-form__radio-label">
                  <input type="radio" name="department" value="在宅医療" data-email="zaitaku@example.com"> 在宅医療
                </label>
              </div>
            </div>
          </div>

          <!-- お名前 -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              お名前<span class="contact-form__required">必須</span>
            </div>
            <div class="contact-form__input-wrap">
              <input type="text" name="your-name" class="contact-form__input" placeholder="例：逗葉 太郎" required>
            </div>
          </div>

          <!-- 会社名 -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              会社名<span class="contact-form__optional">任意</span>
            </div>
            <div class="contact-form__input-wrap">
              <input type="text" name="company-name" class="contact-form__input" placeholder="例：株式会社 逗葉">
            </div>
          </div>

          <!-- emailアドレス -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              emailアドレス<span class="contact-form__required">必須</span>
            </div>
            <div class="contact-form__input-wrap">
              <input type="email" name="your-email" class="contact-form__input" placeholder="例：info@example.com" required>
            </div>
          </div>

          <!-- 電話番号 -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              電話番号<span class="contact-form__optional">任意</span>
            </div>
            <div class="contact-form__input-wrap">
              <input type="tel" name="your-tel" class="contact-form__input" placeholder="例：046-873-4511">
            </div>
          </div>

          <!-- お問合せ内容 -->
          <div class="contact-form__row">
            <div class="contact-form__label">
              お問合せ内容<span class="contact-form__required">必須</span>
            </div>
            <div class="contact-form__input-wrap">
              <textarea name="message" class="contact-form__textarea" placeholder="お問合せ内容をご記入ください" required></textarea>
            </div>
          </div>

          <!-- 送信ボタン -->
          <div class="contact-form__submit">
            <button type="submit" class="contact-form__btn">内容を確認して送信する</button>
          </div>

        </form>
      </div>
    </div>
  </section>


  <!-- ========================================
       Footer
       ======================================== -->
  <div id="site-footer"></div>

  <script>window._useComponents = true;</script>
  <script src="script.js"></script>
  <script src="_includes.js"></script>
  <script>
    /* ---- 部署別メール送信シミュレーション ---- */
    document.getElementById('js-contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const selectedDept = this.querySelector('input[name="department"]:checked');
      if (selectedDept) {
        const targetEmail = selectedDept.dataset.email;
        const deptName = selectedDept.value;
        
        alert(`【送信シミュレーション】\n部署：${deptName}\n送信先：${targetEmail}\n\n実際の実装（WordPress等）では、プログラム側でこの値を元に送信先を振り分けます。`);
      }
    });

    /* ---- P2: 浮かぶプラス記号 ---- */
    (function () {
      const canvas = document.getElementById('js-hero-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width  = canvas.parentElement.offsetWidth;
        canvas.height = canvas.parentElement.offsetHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const crosses = Array.from({ length: 34 }, () => ({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height,
        vx:    (Math.random() - 0.5) * 0.28,
        vy:    (Math.random() - 0.5) * 0.28,
        size:  Math.random() * 14 + 5,
        alpha: Math.random() * 0.3 + 0.12,
        rot:   Math.random() * Math.PI * 2,
        vrot:  (Math.random() - 0.5) * 0.006,
      }));

      function drawCross(x, y, size, alpha, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth   = Math.max(size * 0.18, 1.2);
        ctx.lineCap     = 'round';
        ctx.beginPath();
        ctx.moveTo(-size / 2, 0); ctx.lineTo(size / 2, 0);
        ctx.moveTo(0, -size / 2); ctx.lineTo(0,  size / 2);
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        crosses.forEach(c => {
          c.x   += c.vx;
          c.y   += c.vy;
          c.rot += c.vrot;
          if (c.x < -20) c.x = canvas.width  + 20;
          if (c.x > canvas.width  + 20) c.x = -20;
          if (c.y < -20) c.y = canvas.height + 20;
          if (c.y > canvas.height + 20) c.y = -20;
          drawCross(c.x, c.y, c.size, c.alpha, c.rot);
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
